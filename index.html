<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pash Zero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070707;--card:#121212;--card2:#1a1a1a;--line:#242424;--tx:#f4f1ec;--mut:#85817a;--or:#ff7a1a;--up:#35d07f;--dn:#ff4d4f;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,-apple-system,system-ui,sans-serif}
body{background:radial-gradient(120% 40% at 50% 0,rgba(255,122,26,.16),transparent 70%),var(--bg);background-repeat:no-repeat;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto;padding:12px 16px}
.head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.logo{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--or);background:#000 center/cover;flex:none}
.brand{font:400 30px/1 Anton,Impact,sans-serif;letter-spacing:.5px}.brand i{font-style:normal;color:var(--or)}
.sub{font-size:12px;color:var(--mut)}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.hero{padding:18px 16px 10px}
.n{font:400 46px/1 Anton,Impact,sans-serif;letter-spacing:.5px;margin:4px 0}
.mut{color:var(--mut);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px 0;border-radius:9px;font:600 13px Inter,sans-serif}
.seg button.on{background:var(--or);color:#120800}
.mini{display:flex;border-top:1px solid var(--line)}
.mini div{flex:1;padding:12px 14px}.mini div+div{border-left:1px solid var(--line)}
.mini b{display:block;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border:0}
input,textarea{width:100%;background:transparent;border:0;color:var(--tx);font:inherit;outline:0;text-align:right}
input::placeholder,textarea::placeholder{color:#55524d}
textarea{text-align:left;min-height:70px;resize:none}
label{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 14px;border-radius:99px;font:500 14px Inter,sans-serif}
.chip.on{background:var(--or);border-color:var(--or);color:#120800;font-weight:700}
.btn{display:block;width:100%;border:0;background:var(--or);color:#120800;padding:16px;border-radius:16px;font:700 16px Inter,sans-serif;margin-top:18px}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--dn)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.add{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--or);display:grid;place-items:center;color:var(--or);font-size:28px;flex:none}
.trade{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.trade:last-child{border:0}
.dir{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#08130c}
.pnl{font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(10,10,10,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:140px;border:0;background:none;color:var(--mut);font:500 12px Inter,sans-serif;padding:4px}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--or)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet img.full{width:100%;border-radius:14px;margin-bottom:10px}
svg text{fill:var(--mut);font:10px Inter,sans-serif}

var TF=["M1","M5","M15","H1","H4","D1"],SMC=["BOS","CHoCH","Order Block","FVG","Liquidity sweep","Premium/Discount","Breaker"];
var PER=[["1Д",1],["1Н",7],["1М",30],["3М",90],["Всё",0]];
var S={deposit:1000,trades:[],logo:""},tab="journal",F=null,per=1;
function load(){try{var r=localStorage.getItem("pz");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem("pz",JSON.stringify(S))}catch(e){alert("Не хватает места: удали старые фото")}}
var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
function money(v){return (v<0?"−":"")+"$"+Math.abs(v).toLocaleString("ru-RU",{maximumFractionDigits:2})}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function bal(){return S.trades.reduce(function(a,t){return a+t.pnl},S.deposit)}
function head(t,s){return '<div class="head"><div class="logo" style="background-image:url('+(S.logo||LOGO)+')"></div><div><div class="brand">'+t+'</div>'+(s?'<div class="sub">'+s+'</div>':'')+'</div></div>'}
function nav(){var n=[["journal","▤","Журнал"],["new","＋","Сделка"],["set","⚙","Настройки"]];
document.getElementById("nav").innerHTML=n.map(function(x){return '<button class="'+(tab==x[0]?"on":"")+'" data-t="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join("")}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b){tab=b.dataset.t;if(tab=="new")F={dir:"Long",tf:[],smc:[],photos:[]};render()}};
function render(){nav();document.getElementById("app").innerHTML=({journal:vJournal,new:vNew,set:vSet})[tab]();if(tab=="journal")chart();window.scrollTo(0,0)}
function sorted(){return S.trades.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id})}
function candles(){var b=S.deposit,out=[],T=sorted(),days=per==1;
if(days){T=T.filter(function(t){return t.date==today()});b=S.deposit+sorted().filter(function(t){return t.date<today()}).reduce(function(a,t){return a+t.pnl},0);
T.forEach(function(t,i){out.push({l:"#"+(i+1),o:b,c:b+t.pnl,h:Math.max(b,b+t.pnl),w:Math.min(b,b+t.pnl)});b+=t.pnl});return out}
var g={},k=[];T.forEach(function(t){if(!g[t.date]){g[t.date]=[];k.push(t.date)}g[t.date].push(t)});
k.forEach(function(d){var o=b,h=b,w=b;g[d].forEach(function(t){b+=t.pnl;h=Math.max(h,b);w=Math.min(w,b)});out.push({l:d.slice(8)+"."+d.slice(5,7),d:d,o:o,c:b,h:h,w:w})});
if(per>1){var c=new Date();c.setDate(c.getDate()-per);var cut=c.toISOString().slice(0,10);out=out.filter(function(x){return x.d>=cut})}
return out}
function chart(){var C=candles(),el=document.getElementById("ch");if(!C.length){el.innerHTML='<text x="170" y="100" text-anchor="middle">Нет сделок за период</text>';return}
var mn=Math.min.apply(0,C.map(function(x){return x.w})),mx=Math.max.apply(0,C.map(function(x){return x.h}));if(mn==mx){mn-=1;mx+=1}
var W=340,H=200,PL=8,PR=44,PT=12,PB=22,n=C.length,sl=(W-PL-PR)/n,cw=Math.min(16,sl*.6),y=function(v){return PT+(mx-v)/(mx-mn)*(H-PT-PB)},s="";
for(var i=0;i<4;i++){var v=mn+(mx-mn)*i/3;s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#222"/><text x="'+(W-PR+4)+'" y="'+(y(v)+3)+'">'+Math.round(v)+'</text>'}
C.forEach(function(x,i){var cx=PL+sl*i+sl/2,up=x.c>=x.o,col=up?"var(--up)":"var(--dn)",t=y(Math.max(x.o,x.c)),b=y(Math.min(x.o,x.c));
s+='<line x1="'+cx+'" x2="'+cx+'" y1="'+y(x.h)+'" y2="'+y(x.w)+'" stroke="'+col+'" stroke-width="1.5"/><rect x="'+(cx-cw/2)+'" y="'+t+'" width="'+cw+'" height="'+Math.max(b-t,2)+'" rx="2" fill="'+col+'"/>';
if(n<=8||i%Math.ceil(n/6)==0)s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+x.l+'</text>'});
el.innerHTML=s}
function vJournal(){var b=bal(),C=candles(),d=C.length?C[C.length-1].c-C[0].o:0,t=S.trades,w=t.filter(function(x){return x.pnl>0}).length;
var h=head('PASH <i>ZERO</i>','Торговый дневник · Smart Money')+'<div class="card"><div class="hero"><div class="mut">Баланс</div><div class="n">'+money(b)+'</div><div class="'+(d>=0?"up":"dn")+'" style="font-weight:600">'+(d>=0?"+":"")+money(d)+' <span class="mut" style="font-weight:400">за период</span></div><div class="seg" id="per">'+PER.map(function(p){return '<button data-v="'+p[1]+'" class="'+(per==p[1]?"on":"")+'">'+p[0]+'</button>'}).join("")+'</div><svg id="ch" viewBox="0 0 340 200" width="100%"></svg></div>'
+'<div class="mini"><div><span class="mut">Депозит</span><b>'+money(S.deposit)+'</b></div><div><span class="mut">Сделок</span><b>'+t.length+'</b></div><div><span class="mut">Винрейт</span><b>'+(t.length?Math.round(w/t.length*100):0)+'%</b></div></div></div><h2>Сделки</h2><div class="card">';
if(!t.length)h+='<div class="empty">Пока пусто.<br>Нажми «Сделка», чтобы добавить первую.</div>';
t.slice().reverse().forEach(function(x){h+='<div class="trade" data-id="'+x.id+'"><div class="dir" style="background:'+(x.dir=="Long"?"var(--up)":"var(--dn)")+'">'+(x.dir=="Long"?"L":"S")+'</div><div><div>'+esc(x.pair)+'</div><div class="mut">'+x.date+' · '+(x.tf.join(", ")||"—")+'</div></div><div class="pnl '+(x.pnl>=0?"up":"dn")+'">'+(x.pnl>=0?"+":"")+money(x.pnl)+'</div></div>'});
return h+'</div>'}
function vNew(){var h=head(F.editId?"Правка":"Новая сделка")+'<div class="card"><div class="row"><label>Пара</label><input id="pair" placeholder="XAUUSD" value="'+esc(F.pair)+'"></div><div class="seg" id="dir" style="margin:10px 14px"><button class="'+(F.dir=="Long"?"on":"")+'" data-v="Long">Long</button><button class="'+(F.dir=="Short"?"on":"")+'" data-v="Short">Short</button></div><div class="row"><label>Результат, $</label><input id="pnl" type="number" inputmode="decimal" placeholder="+120 или -50" value="'+(F.pnl===undefined?"":F.pnl)+'"></div><div class="row"><label>Дата</label><input id="date" type="date" value="'+(F.date||today())+'"></div></div>';
h+='<h2>Таймфреймы анализа</h2><div class="card chips" id="tf">'+TF.map(function(t){return '<button class="chip '+(F.tf.indexOf(t)>-1?"on":"")+'" data-v="'+t+'">'+t+'</button>'}).join("")+'</div>';
h+='<h2>Smart Money</h2><div class="card chips" id="smc">'+SMC.map(function(t){return '<button class="chip '+(F.smc.indexOf(t)>-1?"on":"")+'" data-v="'+t+'">'+t+'</button>'}).join("")+'</div>';
h+='<h2>Точка входа</h2><div class="card"><div class="row"><input id="entry" style="text-align:left" placeholder="Например: ретест OB на H4" value="'+esc(F.entry)+'"></div></div><h2>Заметки</h2><div class="card"><div class="row"><textarea id="note" placeholder="Что увидел, почему вошёл">'+esc(F.note)+'</textarea></div></div>';
h+='<h2>Скриншоты</h2><div class="card"><div class="thumbs">'+F.photos.map(function(p){return '<img src="'+p+'">'}).join("")+'<label class="add">＋<input id="ph" type="file" accept="image/*" multiple hidden></label></div></div><button class="btn" id="sv">Сохранить сделку</button>';
return h}
function vSet(){return head("Настройки")+'<div class="card"><div class="row"><label>Стартовый депозит, $</label><input id="dep" type="number" inputmode="decimal" value="'+S.deposit+'"></div><div class="row"><label>Аватарка</label><label class="mut" style="color:var(--or)">Заменить<input id="lg" type="file" accept="image/*" hidden></label></div></div><button class="btn" id="sd">Сохранить</button><button class="btn ghost" id="rs">Удалить все данные</button>'}
function shrink(f,max,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};i.src=r.result};r.readAsDataURL(f)}
function toggle(a,v){var i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v)}
document.getElementById("app").onclick=function(e){var b=e.target.closest("button,.trade"),id=b&&b.id;
if(e.target.closest("#per")&&b){per=+b.dataset.v;render()}
else if(e.target.closest("#tf")&&b&&b.dataset.v){toggle(F.tf,b.dataset.v);b.classList.toggle("on")}
else if(e.target.closest("#smc")&&b&&b.dataset.v){toggle(F.smc,b.dataset.v);b.classList.toggle("on")}
else if(e.target.closest("#dir")&&b){F.dir=b.dataset.v;[].forEach.call(b.parentNode.children,function(x){x.classList.toggle("on",x==b)})}
else if(id=="sv"){var pnl=parseFloat(document.getElementById("pnl").value),pair=document.getElementById("pair").value.trim();if(!pair||isNaN(pnl)){alert("Заполни пару и результат");return}
var nt={id:F.editId||Date.now(),pair:pair.toUpperCase(),dir:F.dir,pnl:pnl,date:document.getElementById("date").value||today(),tf:F.tf,smc:F.smc,entry:document.getElementById("entry").value,note:document.getElementById("note").value,photos:F.photos};if(F.editId)S.trades=S.trades.map(function(x){return x.id==F.editId?nt:x});else S.trades.push(nt);save();tab="journal";render()}
else if(id=="sd"){S.deposit=parseFloat(document.getElementById("dep").value)||0;save();tab="journal";render()}
else if(id=="rs"){if(confirm("Удалить все сделки и настройки?")){S={deposit:1000,trades:[],logo:""};save();render()}}
else if(b&&b.classList.contains("trade"))open(+b.dataset.id)};
document.getElementById("app").onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
if(e.target.id=="ph")[].forEach.call(e.target.files,function(x){shrink(x,900,function(u){F.photos.push(u);var k=["pair","pnl","entry","note","date"].map(function(i){return document.getElementById(i).value});render();["pair","pnl","entry","note","date"].forEach(function(i,j){document.getElementById(i).value=k[j]})})});
if(e.target.id=="lg")shrink(f,200,function(u){S.logo=u;save();render()})};
function open(id){var t=S.trades.filter(function(x){return x.id==id})[0],s=document.getElementById("sheet");if(!t)return;
s.innerHTML='<main>'+head(esc(t.pair))+'<div class="card"><div class="row"><span>Результат</span><b class="'+(t.pnl>=0?"up":"dn")+'">'+money(t.pnl)+'</b></div><div class="row"><span>Направление</span><span>'+t.dir+'</span></div><div class="row"><span>Дата</span><span>'+t.date+'</span></div><div class="row"><span>Таймфреймы</span><span>'+(t.tf.join(", ")||"—")+'</span></div><div class="row"><span>Сетап</span><span>'+(t.smc.join(", ")||"—")+'</span></div><div class="row"><span>Точка входа</span><span>'+esc(t.entry||"—")+'</span></div></div>'+(t.note?'<h2>Заметки</h2><div class="card"><div class="row">'+esc(t.note)+'</div></div>':'')+(t.photos.length?'<h2>Скриншоты</h2>'+t.photos.map(function(p){return '<img class="full" src="'+p+'">'}).join(""):'')+'<button class="btn" id="ed">Редактировать</button><button class="btn ghost" style="color:var(--tx)" id="cl">Закрыть</button><button class="btn ghost" id="dl">Удалить сделку</button></main>';
s.hidden=false;s.onclick=function(e){if(e.target.id=="cl")s.hidden=true;if(e.target.id=="ed"){F=JSON.parse(JSON.stringify(t));F.editId=t.id;s.hidden=true;tab="new";render()}if(e.target.id=="dl"&&confirm("Удалить сделку?")){S.trades=S.trades.filter(function(x){return x.id!=id});save();s.hidden=true;render()}}}
load();render();
</script></body></html>
