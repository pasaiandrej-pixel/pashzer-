<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pash Zero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070707;--card:#121212;--card2:#1a1a1a;--line:#242424;--tx:#f4f1ec;--mut:#85817a;--or:#ff7a1a;--up:#35d07f;--dn:#ff4d4f;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,-apple-system,system-ui,sans-serif}
body{background:radial-gradient(120% 40% at 50% 0,rgba(255,122,26,.16),transparent 70%),var(--bg);background-repeat:no-repeat;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:0 auto;padding:12px 16px}
.head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.logo{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--or);background:#000 center/cover;flex:none}
.brand{font:400 30px/1 Anton,Impact,sans-serif;letter-spacing:.5px}.brand i{font-style:normal;color:var(--or)}
.sub{font-size:12px;color:var(--mut)}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:22px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.hero{padding:18px 16px 10px}
.n{font:400 46px/1 Anton,Impact,sans-serif;letter-spacing:.5px;margin:4px 0}
.mut{color:var(--mut);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:8px 0;border-radius:9px;font:600 13px Inter,sans-serif}
.seg button.on{background:var(--or);color:#120800}
.mini{display:flex;border-top:1px solid var(--line)}
.mini div{flex:1;padding:12px 14px}.mini div+div{border-left:1px solid var(--line)}
.mini b{display:block;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);gap:10px}
.row:last-child{border:0}
input,textarea{width:100%;background:transparent;border:0;color:var(--tx);font:inherit;outline:0;text-align:right}
input::placeholder,textarea::placeholder{color:#55524d}
textarea{text-align:left;min-height:70px;resize:none}
label{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 14px;border-radius:99px;font:500 14px Inter,sans-serif}
.chip.on{background:var(--or);border-color:var(--or);color:#120800;font-weight:700}
.btn{display:block;width:100%;border:0;background:var(--or);color:#120800;padding:16px;border-radius:16px;font:700 16px Inter,sans-serif;margin-top:18px}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--dn)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.add{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--or);display:grid;place-items:center;color:var(--or);font-size:28px;flex:none}
.trade{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.trade:last-child{border:0}
.dir{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#08130c}
.pnl{font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:#0a0a0a;border-top:1px solid var(--line)}
nav button{flex:1;max-width:140px;border:0;background:none;color:var(--mut);font:500 12px Inter,sans-serif;padding:4px}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--or)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet img.full{width:100%;border-radius:14px;margin-bottom:10px}
svg text{fill:var(--mut);font:10px Inter,sans-serif}
#dir button[data-v=Long].on{background:var(--up)}
#dir button[data-v=Short].on{background:var(--dn);color:#fff}.stseg button[data-v=wait].on{background:#3a3a3a;color:var(--tx)}.stseg button[data-v=tp].on{background:var(--up);color:#08130c}.stseg button[data-v=sl].on{background:var(--dn);color:#fff}
.news{display:block;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
.news:last-child{border:0}
.news b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.news span{display:block;margin-top:4px;font-size:12px;color:var(--mut)}
.news em{font-style:normal;color:var(--or);font-weight:600}
.fg{display:flex;align-items:center;gap:14px;padding:16px}
.fg .n{font-size:40px;margin:0;flex:none}button{touch-action:manipulation}.trade,.news{content-visibility:auto;contain-intrinsic-size:auto 66px}#ch circle[data-i]{cursor:pointer}

function addCoin(){var el=document.getElementById("ns");if(!el)return;var c=String(el.value).toUpperCase().replace(/[^A-ZА-ЯЁ0-9]/g,"").slice(0,12);if(!c)return;if(chipList(coins()).indexOf(c)<0)N.cust.push(c);if(N.sel.indexOf(c)<0)N.sel.push(c);N.q="";el.value="";pst();refChips();fillNews()}
function vNews(){var my=coins();
return head("Новости","Что двигает крипторынок")+'<div class="card" id="mk"><div class="empty">Загрузка…</div></div><h2>Страх и жадность</h2><div class="card" id="fg"><div class="empty">Загрузка…</div></div><h2>Ликвидации · OKX</h2><div class="card" id="lq"><div class="empty">Загрузка…</div></div><div class="seg" id="nf"><button data-v="my" class="'+(N.f=="my"&&!N.sel.length?"on":"")+'">Мои монеты'+(my.length?" ("+my.join(", ")+")":"")+'</button><button data-v="all" class="'+(N.f=="all"&&!N.sel.length?"on":"")+'">Все</button></div><div class="card" style="margin-top:10px"><div class="row"><input id="ns" autocomplete="off" placeholder="Поиск по новостям или добавить монету" style="text-align:left" value="'+esc(N.q)+'"><button id="na" class="chip on" style="flex:none">＋</button></div></div><div class="chips" id="nc" style="padding:12px 0 0">'+chipsHtml(my)+'</div><h2>Лента</h2><div class="card" id="nl"><div class="empty">Загрузка…</div></div>'}
function fillNews(){var fg=document.getElementById("fg"),nl=document.getElementById("nl");if(!fg||!nl)return;fillMk();
if(N.fng){var v=+N.fng.value,col=v<40?"var(--dn)":v>60?"var(--up)":"var(--or)",ru={"Extreme Fear":"Крайний страх","Fear":"Страх","Neutral":"Нейтрально","Greed":"Жадность","Extreme Greed":"Крайняя жадность"};
fg.innerHTML='<div class="fg"><div class="n" style="color:'+col+'">'+v+'</div><div><div style="font-weight:600">'+(ru[N.fng.value_classification]||N.fng.value_classification)+'</div><div class="mut">Индекс страха и жадности (0–100). Крайний страх — часто зона интереса покупателей, крайняя жадность — риск коррекции.</div></div></div>'}
else fg.innerHTML='<div class="empty">'+(N.loading?"Загрузка…":"Индекс недоступен")+'</div>';
if(!N.items){nl.innerHTML='<div class="empty">'+(N.err?"Не удалось загрузить новости.<br>Проверь интернет и открой вкладку ещё раз.":"Загрузка…")+'</div>';return}
var my=coins(),list=N.items;
var qq=(N.q||"").trim().toLowerCase();if(qq)list=list.filter(function(x){return (String(x.title)+" "+(N.tr[x.url]||"")+" "+String(x.categories||"")).toLowerCase().indexOf(qq)>-1});else if(N.sel.length)list=list.filter(function(x){return hit(x,N.sel)});else if(N.f=="my"&&my.length)list=list.filter(function(x){return hit(x,my)});
if(!list.length){nl.innerHTML='<div class="empty">'+(qq?"Ничего не найдено по «"+esc(N.q.trim())+"».<br>Нажми ＋, чтобы добавить как монету.":N.sel.length?"По выбранным монетам свежих новостей нет.<br><button class=\"chip\" id=\"nx\" style=\"margin-top:10px\">Сбросить выбор</button>":N.f=="my"&&!my.length?"Добавь сделки — и здесь появятся новости по твоим монетам.":"По твоим монетам свежих новостей нет.<br>Переключи на «Все».")+'</div>';return}
nl.innerHTML=list.slice(0,30).map(function(x){return '<a class="news" href="'+esc(x.url)+'" target="_blank" rel="noopener"><b>'+esc(N.tr[x.url]||x.title)+'</b><span><em>'+esc(x.source_info&&x.source_info.name||x.source||"")+'</em> · '+ago(x.published_on)+(x.categories?" · "+esc(String(x.categories).split("|").slice(0,3).join(", ")):"")+'</span></a>'}).join("")}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
var BU=/\b(surge|rall(y|ies)|soar|jump|climb|gain|rise|rising|record|all-time high|inflow|bullish|breakout|approv)|(^|[^а-яё])(рост|вырос|взл[её]т|ралли|рекорд|приток|одобр|бычь|бычий)/,BE=/\b(crash|plung|drop|fall|slump|sell-?off|outflow|hack|exploit|lawsuit|bearish|liquidat|dump|tumbl)|(^|[^а-яё])(падени|упал|упад|обвал|сниж|отток|взлом|запрет|медвеж|ликвидац)/;
function senti(){var bu=0,be=0;(N.items||[]).slice(0,30).forEach(function(x){var t=String(x.title).toLowerCase();if(BU.test(t))bu++;if(BE.test(t))be++});
var m=N.mk||{},c7=m.c7==null?0:Math.max(-10,Math.min(10,m.c7)),sc=Math.round((bu-be)/(bu+be+1)*40+(N.fng?(+N.fng.value-50)*.6:0)+c7*3);
return{bu:bu,be:be,sc:sc,lab:sc>=20?"Бычий":sc<=-20?"Медвежий":"Боковик"}}
function pc(v){return v==null||isNaN(v)?"—":(v>=0?"+":"−")+Math.abs(v).toFixed(1)+"%"}
function kk(v){return v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e3?Math.round(v/1e3)+"K":Math.round(v)+""}
function fillMk(){var mk=document.getElementById("mk"),lq=document.getElementById("lq");
if(mk){if(!N.items&&!N.fng)mk.innerHTML='<div class="empty">'+(N.loading?"Загрузка…":"Нет данных")+'</div>';else{var s=senti(),col=s.sc>=20?"var(--up)":s.sc<=-20?"var(--dn)":"var(--or)",m=N.mk||{};
mk.innerHTML='<div class="fg"><div class="n" style="color:'+col+'">'+s.lab+'</div><div><div style="font-weight:600">Настроение рынка · '+(s.sc>0?"+":"")+s.sc+' из ±100</div><div class="mut">Заголовки: '+s.bu+' бычьих / '+s.be+' медвежьих'+(N.fng?' · Страх/жадность '+N.fng.value:'')+(m.c7!=null?' · BTC 7д '+pc(m.c7)+', 24ч '+pc(m.c24):'')+'. Оценка по открытым данным, не торговый сигнал.</div></div></div>'}}
if(lq){if(!N.lq)lq.innerHTML='<div class="empty">'+(N.loading?"Загрузка…":"Данные недоступны")+'</div>';else{var L=0,Sh=0;N.lq.forEach(function(x){L+=x.l;Sh+=x.s});
lq.innerHTML='<div class="row"><b>Всего</b><span class="dn">Лонги $'+kk(L)+'</span><span class="up">Шорты $'+kk(Sh)+'</span></div>'+N.lq.map(function(x){return '<div class="row"><span>'+x.c+'</span><span class="dn">Лонги $'+kk(x.l)+'</span><span class="up">Шорты $'+kk(x.s)+'</span></div>'}).join("")+'<div class="row mut" style="font-size:12px">'+(L>Sh*1.5?"Больше выбивают лонги — давление вниз. ":Sh>L*1.5?"Больше выбивают шорты — давление вверх. ":"")+'OKX, последние закрытые ликвидации (не весь рынок).</div>'}}}
var LQ=[["BTC","BTC-USDT",.01],["ETH","ETH-USDT",.1],["SOL","SOL-USDT",1]];
function getLiq(){return Promise.all(LQ.map(function(q){return getJSON("https://www.okx.com/api/v5/public/liquidation-orders?instType=SWAP&instFamily="+q[1]+"&state=filled").then(function(d){var l=0,s=0;(d.data||[]).forEach(function(g){(g.details||[]).forEach(function(x){var v=+x.sz*q[2]*+x.bkPx;if(x.posSide=="long"||(x.posSide=="net"&&x.side=="sell"))l+=v;else s+=v})});return{c:q[0],l:l,s:s}}).catch(function(){return null})})).then(function(a){a=a.filter(Boolean);return a.length?a:null})}
function getMkt(){return getJSON("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin&price_change_percentage=24h,7d").then(function(d){return{c24:d[0].price_change_percentage_24h,c7:d[0].price_change_percentage_7d_in_currency}})}
function loadNews(){var c=null,nu=function(){return null};try{c=JSON.parse(localStorage.getItem("pzn"))}catch(e){}
if(c&&c.items){N.items=c.items;N.fng=c.fng;N.mk=c.mk;N.lq=c.lq;if(Date.now()-c.t<6e5){fillNews();tnews();return}}
fillNews();if(N.loading)return;N.loading=true;
Promise.all([getFeeds().catch(nu),getJSON(FNG_URL).then(function(d){return d.data[0]}).catch(nu),getMkt().catch(nu),getLiq().catch(nu)]).then(function(r){
N.loading=false;N.err=!r[0]&&!N.items;if(r[0])N.items=r[0];if(r[1])N.fng=r[1];if(r[2])N.mk=r[2];if(r[3])N.lq=r[3];
try{if(N.items)localStorage.setItem("pzn",JSON.stringify({t:Date.now(),items:N.items.slice(0,60).map(function(x){return{title:x.title,url:x.url,source:x.source,source_info:{name:x.source_info&&x.source_info.name},published_on:x.published_on,categories:x.categories}}),fng:N.fng,mk:N.mk,lq:N.lq}))}catch(e){}
fillNews();tnews()})}
load();render();
</script></body></html>
